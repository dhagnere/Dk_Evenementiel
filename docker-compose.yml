# PostgreSQL local pour le développement : docker compose up -d postgres
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: dk_calendar
      POSTGRES_USER: dk_calendar
      POSTGRES_PASSWORD: dk_calendar
    ports:
      - '5432:5432'
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dk_calendar -d dk_calendar']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pg_data:
